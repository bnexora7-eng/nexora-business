services:
  - type: cron
    name: nexora-encrypted-database-backup
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    branch: main
    dockerfilePath: ./backup/Dockerfile
    dockerContext: ./backup
    schedule: "0 3 * * *"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-business-db
          property: connectionString
      - key: BACKUP_REPOSITORY
        value: bnexora7-eng/nexora-private-backups
      - key: GITHUB_TOKEN
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
