name: Payment Integrity API tests
on:
  push:
    paths:
      - "payment-integrity-api/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "payment-integrity-api/**"
      - ".github/workflows/api-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: nexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: payment-integrity-api
    env:
      DATABASE_URL: postgres://nexora:test-password@localhost:5432/nexora_test
      PROVIDER_SECRETS: '{"integration-provider":"integration-test-secret-please-change"}'
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high --json > /tmp/nexora-npm-audit.json || audit_status=$?
          node -e 'const a=require("/tmp/nexora-npm-audit.json"); const v=Object.entries(a.vulnerabilities||{}).map(([name,x])=>({name,severity:x.severity,range:x.range,via:x.via.map(y=>typeof y==="string"?y:{title:y.title,url:y.url,range:y.range}),fixAvailable:x.fixAvailable})); console.log(JSON.stringify({counts:a.metadata?.vulnerabilities, vulnerablePackages:v},null,2))'
          if [ "${audit_status:-0}" -ne 0 ]; then exit "$audit_status"; fi
      - run: npm test