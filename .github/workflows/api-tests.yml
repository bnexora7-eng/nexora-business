name: Payment Integrity API tests
on:
  push:
    paths:
      - "payment-integrity-api/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "payment-integrity-api/**"
      - ".github/workflows/api-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-integrity-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test