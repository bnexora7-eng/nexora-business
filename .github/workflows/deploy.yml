name: Deploy NEXORA demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public demo URL
        shell: bash
        run: |
          set -euo pipefail
          URL="https://bnexora7-eng.github.io/nexora-business/payment-integrity-demo/"
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 "$URL" -o /tmp/nexora-demo.html
          grep -q "NEXORA Payment Integrity" /tmp/nexora-demo.html
          grep -q "Run server checks: ACCEPT / REVIEW / REJECT / DUPLICATE" /tmp/nexora-demo.html
          echo "Public demo URL returned the expected NEXORA demo page."
