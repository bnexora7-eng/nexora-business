name: Deploy ALPINOSS demo to GitHub Pages
"on":
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexora_test
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install API dependencies
        working-directory: payment-integrity-api
        run: npm install --no-audit --no-fund
      - name: Run unit and PostgreSQL integration tests
        working-directory: payment-integrity-api
        env:
          RUN_INTEGRATION: "1"
          DATABASE_URL: postgres://nexora:nexora_test_password@127.0.0.1:5432/nexora_test
        run: node --test
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify public GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          URL="https://bnexora7-eng.github.io/nexora-business/"
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 "$URL" -o /tmp/alpinoss-site.html
          grep -q "ALPINOSS" /tmp/alpinoss-site.html
          curl --fail --silent --show-error --location "$URL/account/" -o /tmp/alpinoss-account.html
          grep -q "Create your account" /tmp/alpinoss-account.html
          grep -q "/v1/auth/register" /tmp/alpinoss-account.html
          grep -q "OPEN ALPINOSS WORKSPACE" /tmp/alpinoss-account.html
          curl --fail --silent --show-error --location "$URL/operator/quotes.html" -o /tmp/alpinoss-operator-quotes.html
          grep -q "Operator token" /tmp/alpinoss-operator-quotes.html
          grep -q "Create a quotation" /tmp/alpinoss-operator-quotes.html
          grep -q "Approve quotation" /tmp/alpinoss-operator-quotes.html
          echo "PASS: ALPINOSS operator quotation page is published."
          curl --fail --silent --show-error --location "$URL/app/" -o /tmp/alpinoss-app.html
          grep -q "ALPINOSS Workspace" /tmp/alpinoss-app.html
          grep -q "/v1/business/ai-plan" /tmp/alpinoss-app.html
          for section in PLATFORM TECHNOLOGY MARKETPLACE COMMUNITY; do
            grep -q "$section" /tmp/alpinoss-app.html
          done
          grep -q 'class="brand-visual"' /tmp/alpinoss-app.html
          grep -q 'app/1794828604878.jpg' /tmp/alpinoss-site.html
          grep -q '../app/1794828604878.jpg' /tmp/alpinoss-app.html
          curl --fail --silent --show-error --location "$URL/app/1794828604878.jpg" -o /tmp/alpinoss-official-logo.jpg
          test -s /tmp/alpinoss-official-logo.jpg
          file /tmp/alpinoss-official-logo.jpg | grep -qi "jpeg image data"
          echo "PASS: original ALPINOSS logo image is published on homepage and workspace; all four menu sections are present."
          curl --fail --silent --show-error --location "$URL/order.html" -o /tmp/alpinoss-order.html
          grep -q "Project enquiry" /tmp/alpinoss-order.html
          grep -q "Prepare email enquiry" /tmp/alpinoss-order.html
          echo "Public ALPINOSS website and project enquiry page are reachable on GitHub Pages."
      - name: Verify public privacy and account-deletion pages
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bnexora7-eng.github.io/nexora-business"
          curl --fail --silent --show-error --location "$BASE/privacy/" -o /tmp/alpinoss-privacy.html
          grep -q "ALPINOSS Privacy Policy" /tmp/alpinoss-privacy.html
          curl --fail --silent --show-error --location "$BASE/account-deletion/" -o /tmp/alpinoss-delete.html
          grep -q "Delete your ALPINOSS account" /tmp/alpinoss-delete.html
          grep -q "/v1/auth/delete-request" /tmp/alpinoss-delete.html
          echo "PASS: public privacy policy and account-deletion pages are deployed."
      - name: Verify Render API health and demo decisions
        shell: bash
        env:
          API_BASE_URL: https://nexora-payment-integrity-api.onrender.com
          DEMO_ORIGIN: https://bnexora7-eng.github.io
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            status="$(curl --silent --show-error --output /tmp/alpinoss-health.json --write-out '%{http_code}' --max-time 20 "$API_BASE_URL/health" || true)"
            if [ "$status" = "200" ] && grep -q '"status":"ok"' /tmp/alpinoss-health.json; then
              cat /tmp/alpinoss-health.json
              break
            fi
            if [ "$attempt" = "18" ]; then
              echo "FAIL: Render API health check did not return HTTP 200."
              cat /tmp/alpinoss-health.json 2>/dev/null || true
              exit 1
            fi
            sleep 20
          done
          # Render auto-deploys the same commit independently of this Pages workflow.
          # Give its rolling restart time to finish before testing the in-memory demo dedupe cache.
          sleep 30
          status="$(curl --silent --show-error --output /tmp/alpinoss-health-after-settle.json --write-out '%{http_code}' --max-time 20 "$API_BASE_URL/health" || true)"
          if [ "$status" != "200" ] || ! grep -q '"status":"ok"' /tmp/alpinoss-health-after-settle.json; then
            echo "FAIL: Render API did not remain healthy after deployment settling."
            cat /tmp/alpinoss-health-after-settle.json 2>/dev/null || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          const base = process.env.API_BASE_URL;
          const headers = { "content-type": "application/json", origin: process.env.DEMO_ORIGIN };
          const id = "ci-" + process.env.GITHUB_RUN_ID + "-" + process.env.GITHUB_RUN_ATTEMPT;
          async function post(eventId, status) {
            const response = await fetch(base + "/v1/demo/events", {
              method: "POST", headers,
              body: JSON.stringify({ event_id: eventId, amount: 25, currency: "EUR", status })
            });
            const body = await response.json();
            if (!response.ok) throw new Error("POST " + response.status + ": " + JSON.stringify(body));
            return body;
          }
          const checks = [];
          const accepted = await post(id + "-accept", "succeeded");
          checks.push(["ACCEPT", accepted.decision === "ACCEPT"]);
          const review = await post(id + "-review", "pending");
          checks.push(["REVIEW", review.decision === "REVIEW"]);
          const rejected = await post(id + "-reject", "failed");
          checks.push(["REJECT", rejected.decision === "REJECT"]);
          const duplicateId = id + "-duplicate";
          const first = await post(duplicateId, "succeeded");
          const replay = await post(duplicateId, "succeeded");
          console.log("Duplicate first response:", JSON.stringify(first));
          console.log("Duplicate replay response:", JSON.stringify(replay));
          checks.push(["DUPLICATE", first.decision === "ACCEPT" && replay.decision === "REJECT" && replay.duplicate === true]);
          for (const [name, passed] of checks) console.log((passed ? "PASS " : "FAIL ") + name);
          if (checks.some(([, passed]) => !passed)) throw new Error("One or more live Render API checks failed");
          console.log("PASS: live Render API demo checks.");
          NODE

      - name: Verify browser decisions on public demo
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const url = "https://bnexora7-eng.github.io/nexora-business/payment-integrity-demo/demo.html?browser-check=" + Date.now();
          try {
            await page.goto(url, { waitUntil: "networkidle", timeout: 60000 });
            const status = page.locator("#appStatus");
            await status.waitFor({ state: "visible" });
            const cases = [
              { name: "ACCEPT", value: "succeeded", expected: "ACCEPT" },
              { name: "REVIEW", value: "pending", expected: "REVIEW" },
              { name: "REJECT", value: "failed", expected: "REJECT" }
            ];
            for (const item of cases) {
              const eventId = "browser-ci-" + Date.now() + "-" + item.name.toLowerCase();
              await page.locator("#provider").fill("nexora-browser-ci");
              await page.locator("#event").fill(eventId);
              await page.locator("#amount").fill("25");
              await page.locator("#currency").selectOption("EUR");
              await page.locator("#status").selectOption(item.value);
              await page.locator('#eventForm button[type="submit"]').click();
              await page.locator("#result .decision").waitFor({ state: "visible", timeout: 30000 });
              const actual = (await page.locator("#result .decision").innerText()).trim();
              if (actual !== item.expected) throw new Error(item.name + " UI expected " + item.expected + " but got " + actual);
              console.log("PASS browser UI " + item.name);
            }
            console.log("PASS: ACCEPT, REVIEW and REJECT render correctly in the public browser demo.");
          } finally {
            await browser.close();
          }
          NODE
