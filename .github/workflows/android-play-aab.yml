name: NEXORA signed Google Play App Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-play-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXORA_UPLOAD_KEYSTORE: ${{ github.workspace }}/mobile/android/app/upload-keystore.jks
      NEXORA_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      NEXORA_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      NEXORA_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$NEXORA_UPLOAD_STORE_PASSWORD"
          test -n "$NEXORA_UPLOAD_KEY_ALIAS"
          test -n "$NEXORA_UPLOAD_KEY_PASSWORD"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        working-directory: mobile
        run: npm install
      - name: TypeScript check
        working-directory: mobile
        run: npm run typecheck
      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive
      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$NEXORA_UPLOAD_KEYSTORE"
          test -s "$NEXORA_UPLOAD_KEYSTORE"
      - name: Configure release signing
        working-directory: mobile
        run: node ../scripts/configure-android-signing.mjs android/app/build.gradle
      - name: Build signed Android App Bundle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain bundleRelease
      - name: Verify signed App Bundle
        working-directory: mobile/android
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$NEXORA_UPLOAD_KEYSTORE"
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: nexora-google-play-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
