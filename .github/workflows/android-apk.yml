name: ALPINOSS Android installable test APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
      - "scripts/**"
  push:
    branches: [main, nexora-mobile-app, fix/mobile-api-config, alpinoss-rebrand, fix/mobile-business-task-persistence]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_NEXORA_API_URL: ${{ vars.EXPO_PUBLIC_NEXORA_API_URL || 'https://nexora-payment-integrity-api.onrender.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Preserve generated dependency lock for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpinoss-mobile-package-lock
          path: mobile/package-lock.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit production dependency tree
        working-directory: mobile
        run: |
          npm audit --omit=dev --json > /tmp/alpinoss-mobile-audit.json || audit_status=$?
          node ../scripts/check-mobile-audit.mjs /tmp/alpinoss-mobile-audit.json
      - name: Check TypeScript
        working-directory: mobile
        run: npm run typecheck
      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive
      - name: Build installable test APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleRelease
      - name: Verify APK signature and package metadata
        working-directory: mobile
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.alpinoss.app' versionCode='6' versionName='0.5.1'"
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alpinoss-android-test-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

# Rebuild requested installable APK for phone testing.
