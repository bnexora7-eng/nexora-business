name: NEXORA Android installable test APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main, nexora-mobile-app, fix/mobile-api-config]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_NEXORA_API_URL: ${{ vars.EXPO_PUBLIC_NEXORA_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        working-directory: mobile
        run: npm install
      - name: Check TypeScript
        working-directory: mobile
        run: npm run typecheck
      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive
      - name: Verify Android target API 36
        working-directory: mobile
        run: |
          cat android/gradle.properties
          grep -Eq '^android.targetSdkVersion=36
      - name: Build installable test APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-android-test-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
 android/gradle.properties
          grep -Eq '^android.compileSdkVersion=36
      - name: Build installable test APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleRelease
