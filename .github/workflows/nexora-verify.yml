name: NEXORA independent verification
on:
  push:
    branches: [main]
    paths:
      - "payment-integrity-api/**"
      - ".github/workflows/nexora-verify.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: payment-integrity-api/package.json
      - name: Install API dependencies
        working-directory: payment-integrity-api
        run: npm install --no-audit --no-fund
      - name: Run NEXORA unit tests
        working-directory: payment-integrity-api
        run: npm test
