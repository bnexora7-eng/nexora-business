name: Publish ALPINOSS Android APK release
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-alpinoss-apk.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: alpinoss-apk-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk release-files/ALPINOSS.apk
          sha256sum release-files/ALPINOSS.apk > release-files/SHA256SUMS.txt
          test -s release-files/ALPINOSS.apk
          test "$(stat -c%s release-files/ALPINOSS.apk)" -gt 1000000
      - name: Publish public GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpinoss-android-2026-11-20
          name: ALPINOSS Android — 20 November 2026
          make_latest: true
          files: |
            release-files/ALPINOSS.apk
            release-files/SHA256SUMS.txt
          body: "Public ALPINOSS Android APK download. Install ALPINOSS.apk on your Android device."
