name: NEXORA Mobile Checks

on:
  push:
    branches: [main, nexora-mobile-app]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-check.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npx tsc --noEmit
