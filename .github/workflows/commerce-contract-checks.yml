name: NEXORA commerce contract checks

on:
  push:
    branches:
      - feature/customer-purchase-entitlements
  pull_request:
    branches:
      - main

jobs:
  api-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-integrity-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: node --check src/server.js
      - run: node --test
