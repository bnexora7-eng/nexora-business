<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Verify NEXORA email</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#eff6ff;font:16px/1.6 system-ui;padding:20px}.panel{width:min(520px,100%);background:#102238;border:1px solid #29435d;border-radius:18px;padding:30px;text-align:center}h1{letter-spacing:5px}p{color:#a8b8ca}.status{padding:14px;border-radius:9px;background:#091827;margin:20px 0}a{color:#62e6c5}.button{display:inline-block;background:#62e6c5;color:#061923;text-decoration:none;font-weight:800;padding:12px 20px;border-radius:8px}</style></head><body><main class="panel"><h1>NEXORA</h1><h2>Confirming your email</h2><p id="status" class="status">Please wait while we verify your address…</p><a id="back" class="button" href="./">GO TO SIGN IN</a></main><script>const API="https://nexora-payment-integrity-api.onrender.com";(async()=>{const token=new URLSearchParams(location.search).get("token");const status=document.getElementById("status");if(!token){status.textContent="This link is missing its verification token. Request a new email from the sign-in page.";return;}try{const r=await fetch(API+"/v1/auth/verify-email",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Verification failed.");status.textContent=d.message||"Email confirmed. You can now sign in."; }catch(e){status.textContent=e.message||"The service is temporarily unavailable. Try again later.";}})();</script></body></html>
