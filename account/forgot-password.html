<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Recover NEXORA account</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#eff6ff;font:16px/1.6 system-ui;padding:20px}.panel{width:min(520px,100%);background:#102238;border:1px solid #29435d;border-radius:18px;padding:30px}h1{letter-spacing:5px}p{color:#a8b8ca}label{display:block;margin:14px 0 5px;color:#a8b8ca;font-size:12px}input{width:100%;box-sizing:border-box;background:#071727;color:#eff6ff;border:1px solid #35516b;border-radius:8px;padding:13px;font:inherit}button{width:100%;margin-top:18px;background:#62e6c5;color:#061923;font-weight:800;padding:13px;border:0;border-radius:8px;font:inherit}#status{padding:12px;background:#091827;border-radius:9px;overflow-wrap:anywhere}a{color:#62e6c5}</style></head><body><main class="panel"><h1>NEXORA</h1><h2>Recover your account</h2><p>Enter your account email. If a verified account exists, we will send a secure password reset link.</p><form id="form"><label for="email">EMAIL ADDRESS</label><input id="email" type="email" autocomplete="email" required maxlength="254"><button>SEND RESET LINK</button></form><p id="status" role="status"></p><a href="./">Back to sign in</a></main><script>const API="https://nexora-payment-integrity-api.onrender.com";document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const s=document.getElementById("status");try{const r=await fetch(API+"/v1/auth/request-password-reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value.trim()})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Request failed.");s.textContent=d.message||"If an account exists, a reset link has been sent.";}catch(err){s.textContent=err.message||"The service is temporarily unavailable.";}});</script></body></html>
