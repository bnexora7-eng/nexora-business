openapi: 3.1.0
info:
  title: NEXORA Payment Integrity API
  version: 0.1.0
  description: Pre-production API scaffold for authenticated synthetic payment-event screening. Not a production payment service.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /health:
    get:
      summary: Check API and PostgreSQL connectivity
      responses:
        "200":
          description: Service and database are reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  service: { type: string }
  /v1/auth/register:
    post:
      summary: Create a NEXORA account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "201": { description: Account created and bearer session issued }
        "409": { description: Email is already registered }
        "422": { description: Invalid email or password length }
        "429": { description: Too many account attempts }
        "503": { description: Account database is not configured }
  /v1/auth/login:
    post:
      summary: Sign in to a NEXORA account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: Bearer session issued }
        "401": { description: Invalid credentials }
        "429": { description: Too many account attempts }
        "503": { description: Account database is not configured }
  /v1/auth/me:
    get:
      summary: Get the signed-in account profile
      security:
        - bearerAuth: []
      responses:
        "200": { description: Current account profile }
        "401": { description: Missing, invalid or expired session }
        "503": { description: Account database is not configured }
  /v1/auth/logout:
    post:
      summary: Revoke the current account session
      security:
        - bearerAuth: []
      responses:
        "200": { description: Session revoked }
        "401": { description: Missing or invalid session }
        "503": { description: Account database is not configured }
  /v1/events:
    post:
      summary: Authenticate and screen a provider event
      description: The request body must be signed as HMAC-SHA256(timestamp + "." + exact raw request bytes). Timestamp tolerance is five minutes.
      parameters:
        - in: header
          name: x-nexora-timestamp
          required: true
          schema: { type: string }
        - in: header
          name: x-nexora-signature
          required: true
          description: "sha256=<64-character lowercase or uppercase hex digest>"
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_id, event_id, amount, currency, status]
              properties:
                provider_id: { type: string, minLength: 1 }
                event_id: { type: string, minLength: 1 }
                amount: { type: number, exclusiveMinimum: 0 }
                currency: { type: string, pattern: "^[A-Za-z]{3}$" }
                status: { type: string }
      responses:
        "200":
          description: Event screened or duplicate detected
          content:
            application/json:
              schema:
                type: object
                required: [decision, reason, duplicate, reference]
                properties:
                  decision: { type: string, enum: [ACCEPT, REVIEW, REJECT] }
                  reason: { type: string }
                  duplicate: { type: boolean }
                  reference:
                    type: object
                    properties:
                      provider_id: { type: string }
                      event_id: { type: string }
        "400": { description: Invalid JSON }
        "401": { description: Unknown provider or invalid/expired signature }
        "413": { description: Payload too large }
        "422": { description: Missing or invalid event fields }
        "500": { description: Screening could not be completed }

  /v1/catalogue/products:
    get:
      summary: List the server-owned product catalogue
      responses:
        "200": { description: Catalogue items and current availability }
        "503": { description: Database unavailable }
  /v1/account/products:
    get:
      summary: List products owned by the authenticated account
      security:
        - bearerAuth: []
      responses:
        "200": { description: Non-revoked product entitlements for this account }
        "401": { description: Authentication required }
  /v1/account/payment-integrity/events:
    get:
      summary: List the authenticated customer's recent Payment Integrity events
      security:
        - bearerAuth: []
      responses:
        "200": { description: Up to 100 private event screening records }
        "401": { description: Authentication required }
        "403": { description: Active Payment Integrity entitlement required }
    post:
      summary: Screen and persist a synthetic payment event for the authenticated customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_id, event_id, amount, currency, status]
              properties:
                provider_id: { type: string, maxLength: 128 }
                event_id: { type: string, maxLength: 256 }
                amount: { type: number, exclusiveMinimum: 0 }
                currency: { type: string, pattern: "^[A-Za-z]{3}$" }
                status: { type: string, enum: [SUCCESS, PENDING, FAILED] }
      responses:
        "201": { description: Screening completed and stored }
        "200": { description: Duplicate event detected }
        "401": { description: Authentication required }
        "403": { description: Active Payment Integrity entitlement required }
        "422": { description: Invalid event fields }
  /v1/payments/checkout:
    get:
      summary: Get the configured Gumroad checkout URL for the active product
      security:
        - bearerAuth: []
      responses:
        "200": { description: Secure Gumroad checkout URL and the NEXORA account email to use }
        "401": { description: Authentication required }
        "409": { description: Product unavailable or already owned }
        "503": { description: Gumroad checkout is not configured }
  /v1/payments/gumroad-ping:
    post:
      summary: Receive a Gumroad Ping and verify its sale server-to-server
      parameters:
        - in: query
          name: secret
          required: true
          schema: { type: string, minLength: 32 }
          description: Random shared endpoint secret. The Ping body itself is not payment proof.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [sale_id]
              properties:
                sale_id: { type: string, maxLength: 256 }
                resource_name: { type: string }
      responses:
        "200": { description: Sale verified and entitlement state reconciled }
        "403": { description: Sale seller or product mismatch }
        "404": { description: Invalid secret or unverified sale }
        "409": { description: Sale price or account mapping mismatch }
        "503": { description: Gumroad verification temporarily unavailable }
