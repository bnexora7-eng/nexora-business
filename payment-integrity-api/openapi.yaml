openapi: 3.1.0
info:
  title: ALPINOSS API
  version: 0.2.0
  description: >
    Pre-production ALPINOSS account, project quotation, free workspace and synthetic Payment Integrity API. One-time checkout requires an approved quotation and remains disabled until production-readiness gates are complete.
servers:
  - url: https://nexora-payment-integrity-api.onrender.com
    description: Render pre-production API
  - url: http://localhost:8080
    description: Local development
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    quoteAdminAuth:
      type: http
      scheme: bearer
      description: Server-side operator token stored as QUOTE_ADMIN_TOKEN; never expose to customers.
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        code: { type: string }
    EmailPassword:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
    Status:
      type: object
      properties:
        status: { type: string }
    Subscription:
      type: object
      properties:
        status: { type: string, enum: [inactive, activation_pending, active, past_due, canceled] }
        access: { type: boolean }
        access_until: { type: [string, "null"], format: date-time }
        price: { type: string, example: "29.99" }
        currency: { type: string, example: EUR }
paths:
  /health:
    get:
      summary: Process health
      responses:
        "200": { description: API process is running }
  /ready:
    get:
      summary: Database readiness
      responses:
        "200": { description: API and PostgreSQL are ready }
        "503": { description: Database is not ready }
  /v1/auth/register:
    post:
      summary: Register an account and send an email verification link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailPassword"
      responses:
        "201": { description: Pending account created; no session is issued before email verification }
        "409": { description: Email is already registered }
        "422": { description: Invalid email or password length }
        "429": { description: Rate limit reached }
        "503": { description: Account database or email delivery is unavailable }
  /v1/auth/verify-email:
    post:
      summary: Consume a one-time email verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 30, maxLength: 200 }
      responses:
        "200": { description: Email verified }
        "400": { description: Invalid, expired or already used token }
        "429": { description: Rate limit reached }
  /v1/auth/resend-verification:
    post:
      summary: Resend a verification link without account enumeration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "200": { description: Generic response for known and unknown addresses }
        "429": { description: Rate limit reached }
  /v1/auth/login:
    post:
      summary: Sign in after email verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailPassword"
      responses:
        "200": { description: Verified account session issued }
        "401": { description: Invalid credentials }
        "403": { description: Email verification required }
        "429": { description: Rate limit reached }
  /v1/auth/me:
    get:
      summary: Get current account profile
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current account profile }
        "401": { description: Missing, invalid or expired session }
  /v1/auth/logout:
    post:
      summary: Revoke current session
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Session revoked }
        "401": { description: Missing or invalid session }
  /v1/auth/request-password-reset:
    post:
      summary: Request a one-hour password reset link without account enumeration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "200": { description: Generic response for known and unknown addresses }
        "429": { description: Rate limit reached }
  /v1/auth/reset-password:
    post:
      summary: Consume a one-time password reset token and revoke existing sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, minLength: 30, maxLength: 200 }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "200": { description: Password changed and old sessions revoked }
        "400": { description: Invalid, expired or already used token }
        "422": { description: Password length is invalid }
  /v1/auth/account:
    delete:
      summary: Delete authenticated account and associated user content
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Account deleted; unlinked legally required payment records may remain }
        "401": { description: Authentication required }
        "409": { description: Billing state could not be safely reconciled or canceled }
  /v1/auth/delete-request:
    post:
      summary: Web account deletion using email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailPassword"
      responses:
        "200": { description: Account deleted }
        "401": { description: Invalid credentials }
        "409": { description: Billing state could not be safely reconciled or canceled }
        "429": { description: Rate limit reached }
  /v1/subscriptions/checkout:
    post:
      summary: Disabled legacy subscription checkout
      description: Recurring memberships are not part of ALPINOSS; always returns HTTP 410.
      security: [{ bearerAuth: [] }]
      responses:
        "410": { description: Subscription checkout disabled }
  /v1/subscriptions/me:
    get:
      summary: Disabled legacy subscription status route
      security: [{ bearerAuth: [] }]
      responses:
        "410": { description: Subscription functionality is retired }
  /v1/subscriptions/cancel:
    post:
      summary: Disabled legacy subscription cancellation route
      security: [{ bearerAuth: [] }]
      responses:
        "410": { description: Subscription functionality is retired }
  /internal/quotes:
    post:
      summary: Create a draft project quotation (operator only)
      security: [{ quoteAdminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, amount, description, company_size_tier]
              properties:
                user_id: { type: integer, minimum: 1 }
                amount: { type: string, pattern: "^\\d{1,5}(\\.\\d{1,2})?$", example: "375.00" }
                description: { type: string, minLength: 3, maxLength: 100 }
                company_size_tier: { type: string, enum: [small_company, large_company] }
                expiry_days: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "201": { description: Draft quotation created }
        "401": { description: Operator authentication required }
        "404": { description: Customer account not found }
        "422": { description: Invalid quotation details }
  /internal/quotes/{quote_id}/approve:
    post:
      summary: Approve a draft project quotation (operator only)
      security: [{ quoteAdminAuth: [] }]
      parameters:
        - in: path
          name: quote_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Quotation approved and eligible for customer checkout }
        "401": { description: Operator authentication required }
        "409": { description: Quote is missing, expired or not in draft status }
  /v1/payments:
    post:
      summary: Create a one-off payment for the authenticated customer's approved quotation
      description: The amount, currency and description are read from the approved PostgreSQL quotation. Client-supplied amount and description are ignored. Checkout is disabled unless ENABLE_ONE_OFF_PAYMENTS=true.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id: { type: string, format: uuid }
      responses:
        "201": { description: Mollie checkout created from the approved quotation }
        "401": { description: Authentication required }
        "404": { description: Approved quotation not found for this customer }
        "409": { description: Quotation is not payable or already has a checkout attempt }
        "410": { description: Quotation expired }
        "422": { description: Valid quote_id required }
        "503": { description: One-off checkout disabled by default or provider is not configured }
  /v1/payments/{order_id}:
    get:
      summary: Read the authenticated user's payment status
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: order_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Payment status }
        "401": { description: Authentication required }
        "404": { description: Order not found }
  /v1/payments/mollie-webhook:
    post:
      summary: Mollie payment webhook
      description: Provider notification; the API fetches the payment from Mollie before updating local state.
      responses:
        "200": { description: Notification processed or safely ignored }
        "400": { description: Invalid provider notification }
        "500": { description: Provider reconciliation failed; retry may be required }
  /v1/community/posts:
    get:
      summary: Read public Community posts
      responses:
        "200": { description: Public post list }
    post:
      summary: Publish a Community post
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Post created for an authenticated account }
        "401": { description: Authentication required }
  /v1/marketplace/listings:
    get:
      summary: Read public Marketplace listings
      responses:
        "200": { description: Public listing list }
    post:
      summary: Publish a Marketplace listing
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Listing created for an authenticated account }
        "401": { description: Authentication required }
  /v1/business/workspace:
    get:
      summary: Read authenticated Business Studio workspace
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Workspace data }
        "401": { description: Authentication required }
    put:
      summary: Update Business Studio workspace
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Workspace saved }
        "401": { description: Authentication required }
  /v1/business/ai-plan:
    post:
      summary: Generate an AI business plan
      description: Requires a server-side provider key and non-zero configured monthly token budget; AI remains disabled otherwise.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Generated plan }
        "401": { description: Authentication required }
        "429": { description: Per-account or monthly AI quota reached }
        "503": { description: AI provider is not configured or AI is disabled }
  /v1/events:
    post:
      summary: Authenticate and screen a synthetic provider event
      description: HMAC-SHA256(timestamp + "." + exact raw request bytes), with a five-minute timestamp tolerance. Not a live bank/payment integration.
      parameters:
        - in: header
          name: x-nexora-timestamp
          required: true
          schema: { type: string }
        - in: header
          name: x-nexora-signature
          required: true
          description: "sha256=<64-character hex digest>"
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_id, event_id, amount, currency, status]
              properties:
                provider_id: { type: string, minLength: 1 }
                event_id: { type: string, minLength: 1 }
                amount: { type: number, exclusiveMinimum: 0 }
                currency: { type: string, pattern: "^[A-Za-z]{3}$" }
                status: { type: string }
      responses:
        "200":
          description: Event screened or duplicate detected
          content:
            application/json:
              schema:
                type: object
                required: [decision, reason, duplicate, reference]
                properties:
                  decision: { type: string, enum: [ACCEPT, REVIEW, REJECT] }
                  reason: { type: string }
                  duplicate: { type: boolean }
                  reference: { type: object }
        "400": { description: Invalid JSON }
        "401": { description: Unknown provider or invalid/expired signature }
        "413": { description: Payload too large }
        "422": { description: Missing or invalid event fields }
  /v1/demo/events:
    post:
      summary: Submit a synthetic browser-demo event
      description: Available only when the public demo is enabled and restricted to its configured origin.
      responses:
        "200": { description: Demo decision }
        "403": { description: Demo disabled or origin not allowed }
