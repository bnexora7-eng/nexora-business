services:
  - type: web
    name: nexora-payment-integrity-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./payment-integrity-api/Dockerfile
    dockerContext: ./payment-integrity-api
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-business-db
          property: connectionString
      - key: PGSSL
        value: "false"
      - key: PROVIDER_SECRETS
        sync: false
      - key: MOLLIE_API_KEY
        sync: false
      - key: ENABLE_LIVE_PAYMENTS
        value: "false"
      - key: PUBLIC_API_URL
        value: "https://nexora-payment-integrity-api.onrender.com"
      - key: NEXORA_PAYMENT_RETURN_URL
        value: "https://bnexora7-eng.github.io/nexora-business/"
      - key: REVIEW_THRESHOLD
        value: "10000"
      - key: ENABLE_PUBLIC_DEMO
        value: "true"
      - key: DEMO_ORIGIN
        value: "https://bnexora7-eng.github.io"

databases:
  - name: nexora-business-db
    plan: free
    region: frankfurt
