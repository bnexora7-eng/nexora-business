services:
  - type: web
    name: nexora-payment-integrity-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./payment-integrity-api/Dockerfile
    dockerContext: ./payment-integrity-api
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-business-db
          property: connectionString
      - key: PGSSL
        value: "false"
      - key: PROVIDER_SECRETS
        sync: false
      - key: GUMROAD_ACCESS_TOKEN
        sync: false
      - key: GUMROAD_PRODUCT_ID
        sync: false
      - key: GUMROAD_PRODUCT_URL
        sync: false
      - key: GUMROAD_EXPECTED_SELLER_ID
        sync: false
      - key: GUMROAD_EXPECTED_PRICE_CENTS
        sync: false
      - key: GUMROAD_PING_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://bnexora7-eng.github.io,https://splendid-lokum-02523e.netlify.app"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4.1-mini"
      - key: REVIEW_THRESHOLD
        value: "10000"
      - key: ENABLE_PUBLIC_DEMO
        value: "true"
      - key: DEMO_ORIGIN
        value: "https://bnexora7-eng.github.io"

databases:
  - name: nexora-business-db
    plan: free
    region: frankfurt
